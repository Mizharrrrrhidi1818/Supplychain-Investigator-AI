
services:
  api:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: supplychain-api

    restart: unless-stopped

    env_file:
      - .env

    environment:
      SUPPLYCHAIN_DB_PATH: /app/storage/supplychain.db

    ports:
      - "127.0.0.1:8000:8000"

    volumes:
      - supplychain_data:/app/storage

    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"

volumes:
  supplychain_data:
